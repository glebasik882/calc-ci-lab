stages:
  - lint
  - test
  - build

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  stage: lint
  script:
    - flake8 src tests

test:
  stage: test
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

build:
  stage: build
  script:
    - python -m build
    - pip install dist/*.whl
    - calc --help
  artifacts:
    paths:
      - dist/
    expire_in: 1 week